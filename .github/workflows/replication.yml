name: Replicate paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install uv==0.13.1
      - name: Rebuild from the archived EPA report
        run: |
          # This checkout is disposable. Removing outputs detects any skipped generator.
          rm data/*.csv results/*.csv results/*.json output/pdf/*.pdf
          uv run --locked python reproduce.py --from-pdf
      - name: Verify accounting identities and committed outputs
        run: |
          uv run --locked python -m unittest discover -s tests -v
          changes=$(git status --porcelain --untracked-files=all -- data results output/pdf)
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi
